[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "queryguard"
version = "0.1.0"
description = "Safe, explainable natural-language exploration of PostgreSQL data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.139.2",
    "httpx==0.28.1",
    "openai==2.46.0",
    "psycopg[binary]==3.2.9",
    "pydantic==2.13.4",
    "pydantic-settings==2.12.0",
    "sqlalchemy==2.0.51",
    "sqlglot==30.12.0",
    "streamlit==1.59.2",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.12.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/queryguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.coverage.run]
branch = true
source = ["queryguard"]
